<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1080" viewBox="0 0 1560 1080">
  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .entity { fill: #ffffff; stroke: #2f3a4a; stroke-width: 1.4; rx: 8; }
      .header { fill: #315f72; }
      .header2 { fill: #4c6f3f; }
      .header3 { fill: #725b35; }
      .title { fill: #ffffff; font-family: Arial, sans-serif; font-size: 15px; font-weight: 700; }
      .field { fill: #17202a; font-family: Arial, sans-serif; font-size: 12.5px; }
      .pk { font-weight: 700; }
      .fk { fill: #475569; }
      .caption { fill: #0f172a; font-family: Arial, sans-serif; font-size: 24px; font-weight: 700; }
      .subtitle { fill: #475569; font-family: Arial, sans-serif; font-size: 15px; }
      .note { fill: #334155; font-family: Arial, sans-serif; font-size: 13px; }
      .line { stroke: #64748b; stroke-width: 1.8; fill: none; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1560" height="1080"/>
  <text class="caption" x="50" y="48">Modelo relacional para fichas de campo</text>
  <text class="subtitle" x="50" y="76">Cadeia de custodia, cliente, amostra, medicoes de campo, embalagem/preservacao, analises solicitadas e checklist interno.</text>

  <g id="field_document">
    <rect class="entity" x="50" y="110" width="310" height="220"/>
    <rect class="header" x="50" y="110" width="310" height="36" rx="8"/>
    <text class="title" x="66" y="134">FIELD_DOCUMENT</text>
    <text class="field pk" x="66" y="169">PK field_document_id</text>
    <text class="field" x="66" y="193">nome_do_arquivo</text>
    <text class="field" x="66" y="217">template_id</text>
    <text class="field" x="66" y="241">cadeia_custodia</text>
    <text class="field" x="66" y="265">proposta_comercial</text>
    <text class="field" x="66" y="289">planejamento_amostragem</text>
    <text class="field" x="66" y="313">formulario_codigo / revisao</text>
  </g>

  <g id="field_client">
    <rect class="entity" x="430" y="110" width="270" height="200"/>
    <rect class="header" x="430" y="110" width="270" height="36" rx="8"/>
    <text class="title" x="446" y="134">FIELD_CLIENT</text>
    <text class="field pk" x="446" y="169">PK client_id</text>
    <text class="field fk" x="446" y="193">FK field_document_id</text>
    <text class="field" x="446" y="217">cliente</text>
    <text class="field" x="446" y="241">cnpj_cpf</text>
    <text class="field" x="446" y="265">contato / email / telefone</text>
    <text class="field" x="446" y="289">endereco</text>
  </g>

  <g id="field_sample">
    <rect class="entity" x="780" y="100" width="340" height="270"/>
    <rect class="header" x="780" y="100" width="340" height="36" rx="8"/>
    <text class="title" x="796" y="124">FIELD_SAMPLE</text>
    <text class="field pk" x="796" y="159">PK field_sample_id</text>
    <text class="field fk" x="796" y="183">FK field_document_id</text>
    <text class="field fk" x="796" y="207">FK client_id</text>
    <text class="field" x="796" y="231">amostra_id / id_laboratorio</text>
    <text class="field" x="796" y="255">identificacao_ponto / ponto_codigo</text>
    <text class="field" x="796" y="279">matriz / classe_matriz</text>
    <text class="field" x="796" y="303">data_coleta / hora_coleta</text>
    <text class="field" x="796" y="327">latitude/longitude planejada</text>
    <text class="field" x="796" y="351">latitude/longitude real</text>
  </g>

  <g id="field_measurement">
    <rect class="entity" x="1210" y="115" width="280" height="190"/>
    <rect class="header2" x="1210" y="115" width="280" height="36" rx="8"/>
    <text class="title" x="1226" y="139">FIELD_MEASUREMENT</text>
    <text class="field pk" x="1226" y="174">PK measurement_id</text>
    <text class="field fk" x="1226" y="198">FK field_sample_id</text>
    <text class="field" x="1226" y="222">parametro</text>
    <text class="field" x="1226" y="246">resultado / resultado_tratado</text>
    <text class="field" x="1226" y="270">unidade</text>
    <text class="field" x="1226" y="294">origem_medicao</text>
  </g>

  <g id="field_packaging">
    <rect class="entity" x="70" y="470" width="310" height="230"/>
    <rect class="header2" x="70" y="470" width="310" height="36" rx="8"/>
    <text class="title" x="86" y="494">FIELD_PACKAGING</text>
    <text class="field pk" x="86" y="529">PK packaging_id</text>
    <text class="field fk" x="86" y="553">FK field_sample_id</text>
    <text class="field" x="86" y="577">recipiente</text>
    <text class="field" x="86" y="601">conservacao</text>
    <text class="field" x="86" y="625">preservante</text>
    <text class="field" x="86" y="649">volume_massa</text>
    <text class="field" x="86" y="673">quantidade / observacao</text>
  </g>

  <g id="field_analysis">
    <rect class="entity" x="450" y="470" width="310" height="230"/>
    <rect class="header2" x="450" y="470" width="310" height="36" rx="8"/>
    <text class="title" x="466" y="494">FIELD_REQUESTED_ANALYSIS</text>
    <text class="field pk" x="466" y="529">PK requested_analysis_id</text>
    <text class="field fk" x="466" y="553">FK packaging_id</text>
    <text class="field fk" x="466" y="577">FK field_sample_id</text>
    <text class="field" x="466" y="601">analise</text>
    <text class="field" x="466" y="625">grupo_analitico</text>
    <text class="field" x="466" y="649">laboratorio_destino</text>
    <text class="field" x="466" y="673">subcontratada</text>
  </g>

  <g id="field_receipt">
    <rect class="entity" x="840" y="470" width="310" height="230"/>
    <rect class="header3" x="840" y="470" width="310" height="36" rx="8"/>
    <text class="title" x="856" y="494">FIELD_RECEIPT_CHECKLIST</text>
    <text class="field pk" x="856" y="529">PK receipt_checklist_id</text>
    <text class="field fk" x="856" y="553">FK field_sample_id</text>
    <text class="field" x="856" y="577">data_hora_recebimento</text>
    <text class="field" x="856" y="601">temperatura_recebimento</text>
    <text class="field" x="856" y="625">temperatura_armazenamento</text>
    <text class="field" x="856" y="649">responsavel_recebimento</text>
    <text class="field" x="856" y="673">responsavel_transporte</text>
  </g>

  <g id="field_answer">
    <rect class="entity" x="1210" y="470" width="280" height="210"/>
    <rect class="header3" x="1210" y="470" width="280" height="36" rx="8"/>
    <text class="title" x="1226" y="494">FIELD_RECEIPT_ANSWER</text>
    <text class="field pk" x="1226" y="529">PK answer_id</text>
    <text class="field fk" x="1226" y="553">FK receipt_checklist_id</text>
    <text class="field" x="1226" y="577">pergunta</text>
    <text class="field" x="1226" y="601">resposta</text>
    <text class="field" x="1226" y="625">observacao</text>
  </g>

  <g id="field_responsible">
    <rect class="entity" x="430" y="820" width="280" height="170"/>
    <rect class="header3" x="430" y="820" width="280" height="36" rx="8"/>
    <text class="title" x="446" y="844">FIELD_RESPONSIBLE</text>
    <text class="field pk" x="446" y="879">PK responsible_id</text>
    <text class="field fk" x="446" y="903">FK field_document_id</text>
    <text class="field" x="446" y="927">papel</text>
    <text class="field" x="446" y="951">nome</text>
    <text class="field" x="446" y="975">rubrica_presente</text>
  </g>

  <g id="field_note">
    <rect class="entity" x="810" y="820" width="280" height="170"/>
    <rect class="header3" x="810" y="820" width="280" height="36" rx="8"/>
    <text class="title" x="826" y="844">FIELD_NOTE</text>
    <text class="field pk" x="826" y="879">PK note_id</text>
    <text class="field fk" x="826" y="903">FK field_document_id</text>
    <text class="field" x="826" y="927">ordem</text>
    <text class="field" x="826" y="951">texto</text>
  </g>

  <path class="line" d="M360 205 L430 205" marker-end="url(#arrow)"/>
  <text class="note" x="378" y="195">1:N</text>
  <path class="line" d="M700 215 L780 215" marker-end="url(#arrow)"/>
  <text class="note" x="720" y="205">1:N</text>
  <path class="line" d="M1120 225 L1210 225" marker-end="url(#arrow)"/>
  <text class="note" x="1145" y="215">1:N</text>
  <path class="line" d="M950 370 L950 425 L225 425 L225 470" marker-end="url(#arrow)"/>
  <text class="note" x="270" y="417">1:N</text>
  <path class="line" d="M380 585 L450 585" marker-end="url(#arrow)"/>
  <text class="note" x="400" y="575">1:N</text>
  <path class="line" d="M950 370 L950 470" marker-end="url(#arrow)"/>
  <text class="note" x="965" y="425">1:N</text>
  <path class="line" d="M1150 585 L1210 585" marker-end="url(#arrow)"/>
  <text class="note" x="1163" y="575">1:N</text>
  <path class="line" d="M205 330 L205 790 L570 790 L570 820" marker-end="url(#arrow)"/>
  <text class="note" x="260" y="782">1:N</text>
  <path class="line" d="M205 330 L205 765 L950 765 L950 820" marker-end="url(#arrow)"/>
  <text class="note" x="620" y="757">1:N</text>

  <rect x="50" y="1020" width="1460" height="34" fill="#e8eef4" stroke="#c4ccd6" rx="6"/>
  <text class="note" x="66" y="1042">Nota: medicoes, embalagens e analises solicitadas ficam em tabelas verticais para acomodar agua, sedimento e zoobentos sem criar colunas especificas por matriz.</text>
</svg>
