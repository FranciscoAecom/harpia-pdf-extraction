<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760" role="img" aria-labelledby="title desc">
  <title id="title">Modelo relacional para laudos de agua</title>
  <desc id="desc">Diagrama entidade relacionamento com document, client, sample, result_section, analytical_result e quality_control_result.</desc>
  <defs>
    <style>
      .canvas { fill: #f8fafc; }
      .entity { fill: #ffffff; stroke: #334155; stroke-width: 1.4; rx: 8; }
      .header { fill: #0f766e; }
      .header.alt { fill: #1d4ed8; }
      .header.qc { fill: #7c2d12; }
      .title { fill: #ffffff; font: 700 15px Arial, sans-serif; letter-spacing: 0; }
      .field { fill: #0f172a; font: 12px Arial, sans-serif; letter-spacing: 0; }
      .key { fill: #0f766e; font: 700 12px Arial, sans-serif; letter-spacing: 0; }
      .note { fill: #475569; font: 12px Arial, sans-serif; letter-spacing: 0; }
      .label { fill: #334155; font: 700 12px Arial, sans-serif; letter-spacing: 0; }
      .line { stroke: #475569; stroke-width: 1.6; fill: none; }
      .badge { fill: #e2e8f0; stroke: #94a3b8; stroke-width: 1; }
      .badge-text { fill: #334155; font: 700 11px Arial, sans-serif; letter-spacing: 0; }
    </style>
    <marker id="many" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L10,6 L1,11 M1,6 L10,6" stroke="#475569" stroke-width="1.4" fill="none"/>
    </marker>
  </defs>

  <rect class="canvas" x="0" y="0" width="1180" height="760"/>
  <text x="40" y="42" style="fill:#0f172a;font:700 24px Arial,sans-serif;letter-spacing:0">Modelo relacional para laudos de agua</text>
  <text x="40" y="66" class="note">Separacao entre documento, cliente, amostra, secoes/tabelas, resultados analiticos e QA/QC.</text>

  <!-- DOCUMENT -->
  <g id="document">
    <rect class="entity" x="70" y="115" width="260" height="190"/>
    <rect class="header" x="70" y="115" width="260" height="34" rx="8"/>
    <text class="title" x="90" y="137">DOCUMENT</text>
    <text class="key" x="90" y="170">PK document_id</text>
    <text class="field" x="90" y="192">nome_do_arquivo</text>
    <text class="field" x="90" y="214">template_id</text>
    <text class="field" x="90" y="236">tipo_laudo</text>
    <text class="field" x="90" y="258">numero_relatorio</text>
    <text class="field" x="90" y="280">data_publicacao</text>
  </g>

  <!-- CLIENT -->
  <g id="client">
    <rect class="entity" x="470" y="105" width="260" height="210"/>
    <rect class="header alt" x="470" y="105" width="260" height="34" rx="8"/>
    <text class="title" x="490" y="127">CLIENT</text>
    <text class="key" x="490" y="160">PK client_id</text>
    <text class="key" x="490" y="182">FK document_id</text>
    <text class="field" x="490" y="204">proposta_comercial</text>
    <text class="field" x="490" y="226">cliente</text>
    <text class="field" x="490" y="248">cnpj_cpf</text>
    <text class="field" x="490" y="270">contato</text>
    <text class="field" x="490" y="292">telefone / endereco</text>
  </g>

  <!-- SAMPLE -->
  <g id="sample">
    <rect class="entity" x="470" y="380" width="275" height="250"/>
    <rect class="header" x="470" y="380" width="275" height="34" rx="8"/>
    <text class="title" x="490" y="402">SAMPLE</text>
    <text class="key" x="490" y="435">PK sample_id</text>
    <text class="key" x="490" y="457">FK document_id</text>
    <text class="key" x="490" y="479">FK client_id</text>
    <text class="field" x="490" y="501">id_amostra</text>
    <text class="field" x="490" y="523">tipo_amostra</text>
    <text class="field" x="490" y="545">criterio_conformidade</text>
    <text class="field" x="490" y="567">data_coleta / data_recebimento</text>
    <text class="field" x="490" y="589">latitude / longitude</text>
    <text class="field" x="490" y="611">localizacao / tipo_coleta</text>
  </g>

  <!-- RESULT SECTION -->
  <g id="section">
    <rect class="entity" x="840" y="385" width="270" height="210"/>
    <rect class="header" x="840" y="385" width="270" height="34" rx="8"/>
    <text class="title" x="860" y="407">RESULT_SECTION</text>
    <text class="key" x="860" y="440">PK section_id</text>
    <text class="key" x="860" y="462">FK document_id</text>
    <text class="key" x="860" y="484">FK sample_id</text>
    <text class="field" x="860" y="506">categoria</text>
    <text class="field" x="860" y="528">subcategoria</text>
    <text class="field" x="860" y="550">tipo_registro</text>
    <text class="field" x="860" y="572">local / ordem_no_documento</text>
  </g>

  <!-- ANALYTICAL RESULT -->
  <g id="analytical">
    <rect class="entity" x="95" y="455" width="285" height="240"/>
    <rect class="header" x="95" y="455" width="285" height="34" rx="8"/>
    <text class="title" x="115" y="477">ANALYTICAL_RESULT</text>
    <text class="key" x="115" y="510">PK result_id</text>
    <text class="key" x="115" y="532">FK section_id</text>
    <text class="key" x="115" y="554">FK sample_id</text>
    <text class="field" x="115" y="576">parameter</text>
    <text class="field" x="115" y="598">resultado / resultado_tratado</text>
    <text class="field" x="115" y="620">qualificador / unidade</text>
    <text class="field" x="115" y="642">lq_minimo / lq_maximo / lq_unidade</text>
    <text class="field" x="115" y="664">referencia / incerteza</text>
  </g>

  <!-- QUALITY CONTROL RESULT -->
  <g id="qc">
    <rect class="entity" x="840" y="105" width="285" height="235"/>
    <rect class="header qc" x="840" y="105" width="285" height="34" rx="8"/>
    <text class="title" x="860" y="127">QUALITY_CONTROL_RESULT</text>
    <text class="key" x="860" y="160">PK qc_result_id</text>
    <text class="key" x="860" y="182">FK section_id</text>
    <text class="key" x="860" y="204">FK sample_id</text>
    <text class="field" x="860" y="226">tipo_registro</text>
    <text class="field" x="860" y="248">numero_cq / duplicata</text>
    <text class="field" x="860" y="270">faixa_aceitacao_min/max</text>
    <text class="field" x="860" y="292">quantidade_adicionada</text>
    <text class="field" x="860" y="314">recuperacao_percentual</text>
  </g>

  <!-- Relationships -->
  <path class="line" d="M330 180 C390 180 410 170 470 170" marker-end="url(#many)"/>
  <text class="label" x="365" y="160">1:N</text>
  <text class="note" x="365" y="178">documento-cliente</text>

  <path class="line" d="M330 245 C395 330 405 450 470 480" marker-end="url(#many)"/>
  <text class="label" x="360" y="346">1:N</text>
  <text class="note" x="345" y="364">documento-amostra</text>

  <path class="line" d="M600 315 L600 380" marker-end="url(#many)"/>
  <text class="label" x="615" y="350">1:N</text>
  <text class="note" x="635" y="350">cliente-amostra</text>

  <path class="line" d="M745 500 C780 500 805 500 840 500" marker-end="url(#many)"/>
  <text class="label" x="770" y="480">1:N</text>
  <text class="note" x="760" y="518">amostra-secao</text>

  <path class="line" d="M840 560 C700 675 520 690 380 610" marker-end="url(#many)"/>
  <text class="label" x="610" y="692">1:N</text>
  <text class="note" x="520" y="710">secao-resultados analiticos</text>

  <path class="line" d="M975 385 L975 340" marker-end="url(#many)"/>
  <text class="label" x="992" y="365">1:N</text>
  <text class="note" x="1008" y="365">secao-QA/QC</text>

  <!-- Legend -->
  <g id="legend">
    <rect class="badge" x="70" y="715" width="28" height="18" rx="4"/>
    <text class="badge-text" x="77" y="728">PK</text>
    <text class="note" x="106" y="728">chave primaria</text>
    <rect class="badge" x="220" y="715" width="28" height="18" rx="4"/>
    <text class="badge-text" x="228" y="728">FK</text>
    <text class="note" x="256" y="728">chave estrangeira</text>
    <text class="note" x="410" y="728">1:N indica uma linha na origem relacionada a muitas linhas no destino.</text>
  </g>
</svg>
