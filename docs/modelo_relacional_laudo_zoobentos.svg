<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1040" viewBox="0 0 1500 1040">
  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .entity { fill: #ffffff; stroke: #2f3a4a; stroke-width: 1.4; rx: 8; }
      .header { fill: #215c5c; }
      .header2 { fill: #2f6f6f; }
      .header3 { fill: #6a5d2f; }
      .title { fill: #ffffff; font-family: Arial, sans-serif; font-size: 16px; font-weight: 700; }
      .field { fill: #17202a; font-family: Arial, sans-serif; font-size: 13px; }
      .pk { font-weight: 700; }
      .fk { fill: #475569; }
      .note { fill: #334155; font-family: Arial, sans-serif; font-size: 14px; }
      .caption { fill: #0f172a; font-family: Arial, sans-serif; font-size: 24px; font-weight: 700; }
      .subtitle { fill: #475569; font-family: Arial, sans-serif; font-size: 15px; }
      .line { stroke: #64748b; stroke-width: 1.8; fill: none; }
      .crow { stroke: #64748b; stroke-width: 1.8; fill: none; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1500" height="1040"/>
  <text class="caption" x="50" y="48">Modelo relacional para laudos de zoobentos</text>
  <text class="subtitle" x="50" y="76">Estrutura proposta para laudos ZBT: macrofauna e meiofauna com replicas, arvore taxonomica e metricas de comunidade.</text>

  <!-- Document -->
  <g id="document">
    <rect class="entity" x="50" y="115" width="300" height="190"/>
    <rect class="header" x="50" y="115" width="300" height="36" rx="8"/>
    <text class="title" x="66" y="139">DOCUMENT</text>
    <text class="field pk" x="66" y="174">PK document_id</text>
    <text class="field" x="66" y="198">nome_do_arquivo</text>
    <text class="field" x="66" y="222">template_id</text>
    <text class="field" x="66" y="246">tipo_laudo</text>
    <text class="field" x="66" y="270">numero_relatorio</text>
    <text class="field" x="66" y="294">data_emissao</text>
  </g>

  <!-- Client -->
  <g id="client">
    <rect class="entity" x="430" y="115" width="300" height="190"/>
    <rect class="header" x="430" y="115" width="300" height="36" rx="8"/>
    <text class="title" x="446" y="139">CLIENT</text>
    <text class="field pk" x="446" y="174">PK client_id</text>
    <text class="field fk" x="446" y="198">FK document_id</text>
    <text class="field" x="446" y="222">proposta_tecnica</text>
    <text class="field" x="446" y="246">cliente</text>
    <text class="field" x="446" y="270">endereco</text>
    <text class="field" x="446" y="294">nome_projeto</text>
  </g>

  <!-- Sample -->
  <g id="sample">
    <rect class="entity" x="810" y="105" width="330" height="240"/>
    <rect class="header" x="810" y="105" width="330" height="36" rx="8"/>
    <text class="title" x="826" y="129">SAMPLE</text>
    <text class="field pk" x="826" y="164">PK sample_id</text>
    <text class="field fk" x="826" y="188">FK document_id</text>
    <text class="field fk" x="826" y="212">FK client_id</text>
    <text class="field" x="826" y="236">identificacao_amostra</text>
    <text class="field" x="826" y="260">ponto_amostragem</text>
    <text class="field" x="826" y="284">tipo_amostra</text>
    <text class="field" x="826" y="308">fracao_bentos</text>
    <text class="field" x="826" y="332">data_coleta / hora_coleta</text>
  </g>

  <!-- Method -->
  <g id="method">
    <rect class="entity" x="1210" y="115" width="240" height="190"/>
    <rect class="header3" x="1210" y="115" width="240" height="36" rx="8"/>
    <text class="title" x="1226" y="139">BENTHIC_METHOD</text>
    <text class="field pk" x="1226" y="174">PK method_id</text>
    <text class="field fk" x="1226" y="198">FK sample_id</text>
    <text class="field" x="1226" y="222">parametro</text>
    <text class="field" x="1226" y="246">unidade</text>
    <text class="field" x="1226" y="270">metodo</text>
    <text class="field" x="1226" y="294">lq_minimo / lq_maximo</text>
  </g>

  <!-- Result Section -->
  <g id="section">
    <rect class="entity" x="430" y="420" width="310" height="210"/>
    <rect class="header2" x="430" y="420" width="310" height="36" rx="8"/>
    <text class="title" x="446" y="444">RESULT_SECTION</text>
    <text class="field pk" x="446" y="479">PK section_id</text>
    <text class="field fk" x="446" y="503">FK document_id</text>
    <text class="field fk" x="446" y="527">FK sample_id</text>
    <text class="field" x="446" y="551">categoria</text>
    <text class="field" x="446" y="575">tipo_secao</text>
    <text class="field" x="446" y="599">pagina_inicio</text>
  </g>

  <!-- Replicate -->
  <g id="replicate">
    <rect class="entity" x="50" y="715" width="320" height="230"/>
    <rect class="header2" x="50" y="715" width="320" height="36" rx="8"/>
    <text class="title" x="66" y="739">SAMPLE_REPLICATE</text>
    <text class="field pk" x="66" y="774">PK replicate_id</text>
    <text class="field fk" x="66" y="798">FK section_id</text>
    <text class="field fk" x="66" y="822">FK sample_id</text>
    <text class="field" x="66" y="846">id_laboratorio</text>
    <text class="field" x="66" y="870">replica_nome</text>
    <text class="field" x="66" y="894">area_amostrador_m2</text>
    <text class="field" x="66" y="918">is_somatorio</text>
  </g>

  <!-- Taxon -->
  <g id="taxon">
    <rect class="entity" x="430" y="715" width="310" height="230"/>
    <rect class="header2" x="430" y="715" width="310" height="36" rx="8"/>
    <text class="title" x="446" y="739">TAXON</text>
    <text class="field pk" x="446" y="774">PK taxon_id</text>
    <text class="field fk" x="446" y="798">FK section_id</text>
    <text class="field fk" x="446" y="822">FK parent_taxon_id</text>
    <text class="field" x="446" y="846">rank_taxonomico</text>
    <text class="field" x="446" y="870">nome_taxon</text>
    <text class="field" x="446" y="894">nivel_hierarquico</text>
    <text class="field" x="446" y="918">ordem_no_documento</text>
  </g>

  <!-- Taxon Count -->
  <g id="taxon_count">
    <rect class="entity" x="810" y="715" width="320" height="230"/>
    <rect class="header2" x="810" y="715" width="320" height="36" rx="8"/>
    <text class="title" x="826" y="739">TAXON_COUNT</text>
    <text class="field pk" x="826" y="774">PK taxon_count_id</text>
    <text class="field fk" x="826" y="798">FK section_id</text>
    <text class="field fk" x="826" y="822">FK replicate_id</text>
    <text class="field fk" x="826" y="846">FK taxon_id</text>
    <text class="field" x="826" y="870">resultado</text>
    <text class="field" x="826" y="894">resultado_tratado</text>
    <text class="field" x="826" y="918">unidade</text>
  </g>

  <!-- Community Metric -->
  <g id="metric">
    <rect class="entity" x="1190" y="715" width="260" height="230"/>
    <rect class="header2" x="1190" y="715" width="260" height="36" rx="8"/>
    <text class="title" x="1206" y="739">COMMUNITY_METRIC</text>
    <text class="field pk" x="1206" y="774">PK metric_id</text>
    <text class="field fk" x="1206" y="798">FK section_id</text>
    <text class="field fk" x="1206" y="822">FK replicate_id</text>
    <text class="field" x="1206" y="846">metrica</text>
    <text class="field" x="1206" y="870">resultado</text>
    <text class="field" x="1206" y="894">resultado_tratado</text>
    <text class="field" x="1206" y="918">unidade</text>
  </g>

  <!-- Relationships -->
  <path class="line" d="M350 205 L430 205" marker-end="url(#arrow)"/>
  <text class="note" x="370" y="196">1:N</text>

  <path class="line" d="M730 220 L810 220" marker-end="url(#arrow)"/>
  <text class="note" x="750" y="211">1:N</text>

  <path class="line" d="M975 345 L975 382 L585 382 L585 420" marker-end="url(#arrow)"/>
  <text class="note" x="790" y="373">1:N</text>

  <path class="line" d="M1140 220 L1210 220" marker-end="url(#arrow)"/>
  <text class="note" x="1160" y="211">1:N</text>

  <path class="line" d="M585 630 L210 630 L210 715" marker-end="url(#arrow)"/>
  <text class="note" x="250" y="650">1:N</text>

  <path class="line" d="M585 630 L585 715" marker-end="url(#arrow)"/>
  <text class="note" x="598" y="678">1:N</text>

  <path class="line" d="M740 830 L810 830" marker-end="url(#arrow)"/>
  <text class="note" x="760" y="821">1:N</text>

  <path class="line" d="M370 830 L810 830" marker-end="url(#arrow)"/>

  <path class="line" d="M370 885 L1190 885" marker-end="url(#arrow)"/>
  <text class="note" x="760" y="875">1:N</text>

  <path class="line" d="M585 945 C585 1000 385 1000 385 825 C385 780 430 775 430 775" marker-end="url(#arrow)"/>
  <text class="note" x="420" y="1008">auto-relacao: taxon pai/filho</text>

  <rect x="50" y="980" width="1400" height="34" fill="#e6f0ef" stroke="#b6c7c5" rx="6"/>
  <text class="note" x="66" y="1002">Nota: SAMPLE_REPLICATE guarda Replica 1, Replica 2, Replica 3 e Somatorio das replicas; TAXON_COUNT guarda os valores por taxon e replica; COMMUNITY_METRIC guarda total, riqueza, densidade e biomassa.</text>
</svg>
